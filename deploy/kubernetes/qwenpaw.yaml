apiVersion: v1
kind: Namespace
metadata:
  name: qwenpaw
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwenpaw-data
  namespace: qwenpaw
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwenpaw
  namespace: qwenpaw
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwenpaw
  template:
    metadata:
      labels:
        app: qwenpaw
    spec:
      nodeSelector:
        node-type: worker
        kubernetes.io/hostname: worker-1
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: console-http-compat
          image: agentscope/qwenpaw:pre@sha256:bae2c8a0d7f937dd42fd1cae6ab2b88109918f200c29a8b1d243e2f5029c6743
          command:
            - sh
            - -ec
            - |
              python - <<'PY'
              from pathlib import Path
              import shutil

              shutil.copytree("/app/venv/lib/python3.11/site-packages/qwenpaw/console", "/patched", dirs_exist_ok=True)
              bundles = list(Path("/patched/assets").glob("index-x-*.js"))
              assert len(bundles) == 1, f"expected one terminal bundle, found {len(bundles)}"
              bundle = bundles[0]
              source = bundle.read_text()
              assert source.count("crypto.randomUUID()") == 1, "unexpected terminal UUID call"
              bundle.write_text(source.replace(
                  "crypto.randomUUID()",
                  "crypto.randomUUID?.()??Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,\"0\")).join(\"\")",
              ))
              PY
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: console-patched
              mountPath: /patched
      containers:
        - name: qwenpaw
          image: agentscope/qwenpaw:pre@sha256:bae2c8a0d7f937dd42fd1cae6ab2b88109918f200c29a8b1d243e2f5029c6743
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
          env:
            - name: QWENPAW_PORT
              value: "8088"
            - name: QWENPAW_WORKING_DIR
              value: /app/persistent/working
            - name: QWENPAW_SECRET_DIR
              value: /app/persistent/secret
            - name: QWENPAW_BACKUP_DIR
              value: /app/persistent/backups
            - name: QWENPAW_AUTH_ENABLED
              value: "true"
            - name: QWENPAW_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: qwenpaw-auth
                  key: username
            - name: QWENPAW_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qwenpaw-auth
                  key: password
          volumeMounts:
            - name: data
              mountPath: /app/persistent
            - name: console-patched
              mountPath: /app/venv/lib/python3.11/site-packages/qwenpaw/console
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          startupProbe:
            httpGet:
              path: /api/auth/status
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/auth/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/auth/status
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: qwenpaw-data
        - name: console-patched
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: qwenpaw
  namespace: qwenpaw
spec:
  selector:
    app: qwenpaw
  ports:
    - name: http
      port: 8088
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qwenpaw
  namespace: qwenpaw
spec:
  ingressClassName: traefik
  rules:
    - host: qwenpaw.192.168.1.8.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qwenpaw
                port:
                  name: http
